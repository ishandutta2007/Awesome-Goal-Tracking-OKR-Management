<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Glowing Background Orbs / Beams (staying in background) -->
  <g opacity="0.35">
    <circle cx="150" cy="70" r="110" fill="#0284c7" filter="url(#glow)">
      <animate attributeName="r" values="100;125;100" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.45;0.25" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="200" r="130" fill="#7c3aed" filter="url(#glow)">
      <animate attributeName="r" values="120;145;120" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="240" r="90" fill="#06b6d4" filter="url(#glow)">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Animated Metric Flow Waves (Kept low at bottom background) -->
  <g opacity="0.45">
    <path d="M -100 230 Q 250 170, 500 230 T 1100 230" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6">
      <animate attributeName="d" values="M -100 230 Q 250 170, 500 230 T 1100 230; M -100 230 Q 250 260, 500 210 T 1100 230; M -100 230 Q 250 170, 500 230 T 1100 230" dur="7s" repeatCount="indefinite" />
    </path>
    <path d="M -100 250 Q 300 210, 600 250 T 1100 240" fill="none" stroke="#a855f7" stroke-width="2.5">
      <animate attributeName="d" values="M -100 250 Q 300 210, 600 250 T 1100 240; M -100 250 Q 300 270, 600 220 T 1100 250; M -100 250 Q 300 210, 600 250 T 1100 240" dur="9s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Animated Sparkles / Target Points -->
  <circle cx="180" cy="190" r="3" fill="#38bdf8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="r" values="2;4;2" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="820" cy="70" r="3.5" fill="#c084fc">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
    <animate attributeName="r" values="2.5;4.5;2.5" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="910" cy="140" r="2.5" fill="#34d399">
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="90" cy="120" r="2.5" fill="#f43f5e">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- FOREGROUND CONTENT: Strictly crisp, high-contrast, always above background -->
  <!-- Category Pill Badge -->
  <g transform="translate(370, 28)">
    <rect width="260" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1.5">
      STRATEGY &amp; EXECUTION
    </text>
  </g>

  <!-- Main Title -->
  <text x="50%" y="108" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="40" fill="url(#titleGrad)" filter="url(#glow)">
    Goal Tracking &amp; OKR Management
  </text>

  <!-- Subtitle -->
  <text x="50%" y="152" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="17" fill="#cbd5e1">
    Curated Hub of SaaS Platforms, Self-Hosted Engines &amp; Open-Source Frameworks
  </text>

  <!-- Feature Pills in Foreground -->
  <g transform="translate(140, 185)">
    <!-- Pill 1: OKRs & KPIs -->
    <g transform="translate(0, 0)">
      <rect width="165" height="32" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <text x="82" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        🎯 Objectives &amp; KRs
      </text>
    </g>

    <!-- Pill 2: Weekly Check-ins -->
    <g transform="translate(180, 0)">
      <rect width="170" height="32" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2" />
      <text x="85" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        📈 Progress Check-ins
      </text>
    </g>

    <!-- Pill 3: Self-Hosted & Open Source -->
    <g transform="translate(365, 0)">
      <rect width="180" height="32" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.2" />
      <text x="90" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        🔓 Self-Hosted Engines
      </text>
    </g>

    <!-- Pill 4: Enterprise Strategy -->
    <g transform="translate(560, 0)">
      <rect width="160" height="32" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.2" />
      <text x="80" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        🏢 Strategy Alignment
      </text>
    </g>
  </g>
</svg>
